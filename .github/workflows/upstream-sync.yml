name: Upstream sync

# Weekly check for a new upstream FreeTube release. When one exists this merges it into a
# branch and opens a DRAFT pull request; it never touches main. Conflicts that policy cannot
# resolve open an issue instead. See docs/fork/UPSTREAM_SYNC.md.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Upstream tag, branch or commit to merge (empty = newest release)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'jimbobsmith/drivedeck-desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEFTHOOK: '0'
      # UPSTREAM_SYNC_TOKEN is a fine-grained PAT. Pull requests opened with the default token
      # do not start other workflows, so without it the PR would have no CI checks.
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.7
          cache: false

      - name: Merge newest upstream release
        run: python3 tools/upstream-sync/sync.py ${TARGET:+--target "$TARGET"}
